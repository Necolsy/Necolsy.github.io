# ---------------------------------------------------------------- A1 Front page
front:
  kicker: Profile
  headline: "Making sense of"
  headline_em: "air, data, and cities."
  name: Subin Lin
  role: "PhD Candidate · National University of Singapore"
  paragraphs:
    - I am a PhD candidate in the Department of the Built Environment at the National University of Singapore, working at the intersection of environmental fluid mechanics, experiments, and data-driven modelling.
    - My doctoral research asks how building geometry and porosity shape street-canyon ventilation. I designed and conducted pressure-tap wind-tunnel experiments and use RANS/LES simulations to examine pedestrian wind, air exchange, and model fidelity.
  photo:
    image: subin-lin-beach.jpg
    alt: Subin Lin overlooking the coast
    caption: Curious by nature. Across disciplines and borders.
  now_kicker: Now
  now:
    - tag: "A*STAR"
      title: Tracing pollutants.
      text: Research internship since September 2026 on pollutant dispersion, source identification, and concentration forecasting.
    - tag: "NUS–SIA"
      title: Designing local airflow.
      text: Comparing aircraft-cabin air-terminal designs using CFD, with prototyping and experimental validation.
    - tag: Teaching
      title: Sharing what I learn.
      text: Teaching Assistant for BPS5234A CFD Applications in the Built Environment.
  wanted:
    title: WANTED
    text: "Postdoctoral, research scientist, and R&D opportunities."
    button: Get in touch
  honours:
    - year: "2026"
      title: IAQVEC Fellowship
      note: Participation support
    - year: "2022"
      title: "A*STAR Merit Award"
      note: SINGA doctoral scholarship
    - year: "2021"
      title: Third Prize
      note: "AI & Big Data Hackathon"
    - year: "2018–19"
      title: Dean’s List
      note: Technion

# ------------------------------------------------------------------ B1 Research
themes:
  - image: urban-cfd-flow.jpg
    kicker: Urban fluid mechanics
    title: Air moves. Geometry matters.
    text: Building porosity, opening configuration, and array length can change pedestrian wind and canyon-scale exchange in different ways. I study those trade-offs through validated CFD.
  - image: wind-tunnel-concept.jpg
    kicker: Hands-on experiments
    title: From the lab to the model.
    text: Wind-tunnel models, pressure taps, tubing, data acquisition, and uncertainty analysis. Earlier work also brought me into water-treatment wet labs and infrared field sensing.
  - image: physics-ai-concept.jpg
    kicker: Environmental AI
    title: Learning with physical context.
    text: Graph learning and time-series forecasting for environmental operations; LLM-generated heuristics for building energy and HVAC diagnostics; emerging work on pollutant-source inference.

